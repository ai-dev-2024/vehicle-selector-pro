<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <!-- machine-paper base -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF1F4"/>
      <stop offset="1" stop-color="#E6EAF0"/>
    </linearGradient>
    <!-- blueprint grid -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0B1016" stroke-opacity="0.05"/>
      <circle cx="44" cy="0" r="1.1" fill="#0B1016" fill-opacity="0.14"/>
    </pattern>
    <!-- torch-orange signal rail -->
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A10"/>
      <stop offset="1" stop-color="#E63F00"/>
    </linearGradient>
    <!-- ink panel fill -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161D"/>
      <stop offset="1" stop-color="#0B1016"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D1DA"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#paper)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- left border rule + corner registration ticks (shop-drawing motif) -->
  <g stroke="#0B1016" stroke-opacity="0.85">
    <path d="M28 34 H248 M28 34 V154" fill="none"/>
    <line x1="28" y1="386" x2="248" y2="386"/>
    <line x1="52" y1="34" x2="52" y2="25"/>
    <line x1="100" y1="34" x2="100" y2="25"/>
    <line x1="148" y1="34" x2="148" y2="25"/>
    <line x1="196" y1="34" x2="196" y2="25"/>
    <line x1="52" y1="386" x2="52" y2="377"/>
    <line x1="100" y1="386" x2="100" y2="377"/>
  </g>

  <!-- torch-orange signal rail under the header word -->
  <rect x="28" y="88" width="88" height="6" fill="url(#signal)"/>

  <!-- eyebrow: mono data label -->
  <text x="28" y="62" fill="#0B1016" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="3">SHOPIFY APP · RAILS 7.1 · SIDEKIQ</text>

  <!-- head-word / display -->
  <text x="28" y="168" fill="url(#wordmark)" font-family="Barlow Condensed, 'Arial Narrow', sans-serif" font-size="74" font-weight="700" letter-spacing="0.5">VEHICLE SELECTOR PRO</text>
  <text x="28" y="206" fill="#0B1016" font-family="Barlow Condensed, 'Arial Narrow', sans-serif" font-size="25" font-weight="500" letter-spacing="0.5">YEAR / MAKE / MODEL / TRIM / ENGINE — FITMENT INTELLIGENCE FOR SHOPIFY AUTOMOTIVE STORES</text>
  <text x="28" y="240" fill="#46535F" font-family="Archivo, Segoe UI, sans-serif" font-size="17">Cascading fitment widget · Guaranteed-Exact-Fit badges · App Proxy + GraphQL sync</text>

  <!-- feature ticks (mono) -->
  <g font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="13" font-weight="500" fill="#0B1016">
    <rect x="28" y="268" width="16" height="16" fill="none" stroke="#FF4A00"/>
    <text x="30" y="281" fill="#FF4A00" font-size="12" font-weight="700">✓</text>
    <text x="54" y="281">Cascading storefront widget</text>

    <rect x="28" y="302" width="16" height="16" fill="none" stroke="#FF4A00"/>
    <text x="30" y="315" fill="#FF4A00" font-size="12" font-weight="700">✓</text>
    <text x="54" y="315">Guaranteed-fit PDP badges</text>

    <rect x="28" y="336" width="16" height="16" fill="none" stroke="#FF4A00"/>
    <text x="30" y="349" fill="#FF4A00" font-size="12" font-weight="700">✓</text>
    <text x="54" y="349">GraphQL metafield sync</text>

    <rect x="28" y="370" width="16" height="16" fill="none" stroke="#FF4A00"/>
    <text x="30" y="383" fill="#FF4A00" font-size="12" font-weight="700">✓</text>
    <text x="54" y="383">HMAC-signed App Proxy</text>
  </g>

  <!-- bootom-left footer -->
  <text x="112" y="398" fill="#6A7680" font-family="'IBM Plex Mono','Courier New',monospace" font-size="12" letter-spacing="1">vehicle-selector-pro.fly.dev · THEME APP EXTENSION · SIDEKIQ · POSTGRESQL</text>

  <!-- right: ink data-plate (fitment console) -->
  <g>
    <!-- stamp note behind plate -->
    <text x="886" y="128" fill="#0B1016" font-family="'IBM Plex Mono','Courier New',monospace" font-size="15" font-weight="700" letter-spacing="3">FITMENT ID · VSP-2024</text>

    <rect x="880" y="142" width="352" height="252" rx="12" fill="url(#ink)"/>
    <!-- torch-orange rail on the plate top -->
    <rect x="880" y="142" width="352" height="6" rx="3" fill="url(#signal)"/>

    <text x="908" y="182" fill="#8FA0B2" font-family="'IBM Plex Mono','Courier New',monospace" font-size="13" font-weight="600" letter-spacing="1">FIND PARTS THAT FIT</text>
    <circle cx="1204" cy="177" r="5" fill="#FF4A00"/>

    <!-- dropdown rows -->
    <g font-family="'IBM Plex Mono','Courier New',monospace" font-size="13" font-weight="600">
      <rect x="908" y="200" width="96" height="40" rx="6" fill="#171F28" stroke="#2A3643"/>
      <text x="922" y="226" fill="#E6EEF6">2024 ▾</text>
      <rect x="1014" y="200" width="96" height="40" rx="6" fill="#171F28" stroke="#2A3643"/>
      <text x="1028" y="226" fill="#E6EEF6">Ford ▾</text>
      <rect x="1120" y="200" width="88" height="40" rx="6" fill="#171F28" stroke="#2A3643"/>
      <text x="1134" y="226" fill="#E6EEF6">F-150 ▾</text>
    </g>

    <!-- find parts button -->
    <rect x="908" y="256" width="300" height="46" rx="6" fill="url(#signal)"/>
    <text x="1058" y="285" fill="#FFFFFF" font-family="'IBM Plex Mono','Courier New',monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">FIND PARTS</text>

    <!-- guaranteed-exact-fit plate -->
    <rect x="908" y="318" width="300" height="40" rx="6" fill="#123426" stroke="#FF4A00" stroke-opacity="0.6"/>
    <text x="926" y="343" fill="#6EE7B7" font-family="'IBM Plex Mono','Courier New',monospace" font-size="13" font-weight="700">✓ GUARANTEED EXACT FIT</text>
    <text x="1180" y="343" fill="#4B5563" font-family="'IBM Plex Mono','Courier New',monospace" font-size="12" text-anchor="end">3.5L V6</text>
  </g>
</svg>