    <text x="744" y="222" fill="#ffffff" font-size="17" font-weight="700">🚗  Select Your Vehicle</text>
    <text x="744" y="244" fill="#64748b" font-size="12.5">Find parts guaranteed to fit your exact vehicle</text>

    <g font-size="13">
      <rect x="744" y="262" width="100" height="40" rx="8" fill="#122032" stroke="#2b3b52"/>
      <text x="758" y="277" fill="#64748b" font-size="10">YEAR</text>
      <text x="758" y="295" fill="#e2e8f0" font-weight="600">2024 ▾</text>
      <rect x="854" y="262" width="100" height="40" rx="8" fill="#122032" stroke="#2b3b52"/>
      <text x="868" y="277" fill="#64748b" font-size="10">MAKE</text>
      <text x="868" y="295" fill="#e2e8f0" font-weight="600">Ford ▾</text>
      <rect x="964" y="262" width="110" height="40" rx="8" fill="#122032" stroke="#2b3b52"/>
      <text x="978" y="277" fill="#64748b" font-size="10">MODEL</text>
      <text x="978" y="295" fill="#e2e8f0" font-weight="600">F-150 ▾</text>
      <rect x="1084" y="262" width="88" height="40" rx="8" fill="url(#green)"/>
      <text x="1128" y="287" fill="#ffffff" font-weight="700" text-anchor="middle">Find Parts</text>
    </g>

    <!-- result product cards -->
    <rect x="724" y="356" width="226" height="150" rx="12" fill="#0b1420" stroke="#1f2c3d"/>
    <rect x="740" y="372" width="194" height="54" rx="8" fill="#122032"/>
    <text x="837" y="404" fill="#475569" font-size="24" text-anchor="middle">🌀</text>
    <text x="740" y="446" fill="#e2e8f0" font-size="12.5" font-weight="600">Stage-2 Cold Air Intake</text>
    <rect x="740" y="458" width="176" height="30" rx="8" fill="#052e16" stroke="#166534"/>
    <text x="828" y="477" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">✔ Guaranteed Exact Fit</text>

    <rect x="962" y="356" width="226" height="150" rx="12" fill="#0b1420" stroke="#1f2c3d"/>
    <rect x="978" y="372" width="194" height="54" rx="8" fill="#122032"/>
    <text x="1075" y="404" fill="#475569" font-size="24" text-anchor="middle">🛞</text>
    <text x="978" y="446" fill="#e2e8f0" font-size="12.5" font-weight="600">Severe-Duty Brake Kit</text>
    <rect x="978" y="458" width="176" height="30" rx="8" fill="#052e16" stroke="#166534"/>
    <text x="1066" y="477" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">✔ Guaranteed Exact Fit</text>
  </g>
</svg>
