<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1b2e"/>
      <stop offset="1" stop-color="#0b2620"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#008060"/>
      <stop offset="1" stop-color="#00a37c"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b7e4d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a37c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00a37c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0 105 H1280 M0 210 H1280 M0 315 H1280"/>
    <path d="M160 0 V420 M320 0 V420 M480 0 V420 M640 0 V420 M800 0 V420 M960 0 V420 M1120 0 V420"/>
  </g>

  <!-- ambient glow -->
  <ellipse cx="1080" cy="70" rx="320" ry="220" fill="url(#glow)"/>
  <ellipse cx="140" cy="380" rx="280" ry="180" fill="#1f6feb" opacity="0.07"/>

  <!-- left: wordmark + tagline -->
  <g>
    <rect x="64" y="72" width="252" height="34" rx="17" fill="#008060" fill-opacity="0.14" stroke="#00a37c" stroke-opacity="0.5"/>
    <text x="190" y="94" fill="#4fd1b0" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">SHOPIFY APP · RAILS 7.1</text>

    <text x="64" y="182" fill="url(#wordmark)" font-size="64" font-weight="800" letter-spacing="-1.5">Vehicle Selector Pro</text>
    <text x="64" y="226" fill="#9fb3c8" font-size="22" font-weight="500">Year / Make / Model / Trim / Engine fitment intelligence</text>
    <text x="64" y="256" fill="#9fb3c8" font-size="22" font-weight="500">for Shopify automotive storefronts.</text>

    <!-- feature ticks -->
    <g font-size="15.5" font-weight="600" fill="#dbe7f3">
      <circle cx="74" cy="302" r="4.5" fill="#00a37c"/>
      <text x="90" y="307">Cascading storefront widget</text>
      <circle cx="74" cy="338" r="4.5" fill="#00a37c"/>
      <text x="90" y="343">Guaranteed-fit PDP badges</text>
      <circle cx="420" cy="302" r="4.5" fill="#00a37c"/>
      <text x="436" y="307">GraphQL metafield sync</text>
      <circle cx="420" cy="338" r="4.5" fill="#00a37c"/>
      <text x="436" y="343">HMAC-signed App Proxy</text>
    </g>

    <text x="64" y="392" fill="#5b7089" font-size="15">vehicle-selector-pro.fly.dev · Theme App Extension · Sidekiq · PostgreSQL</text>
  </g>

  <!-- right: minimal YMM selector mark -->
  <g>
    <rect x="880" y="96" width="336" height="228" rx="16" fill="#0d1622" stroke="#1f3048"/>
    <rect x="880" y="96" width="336" height="46" rx="16" fill="#0a1119"/>
    <rect x="880" y="126" width="336" height="16" fill="#0a1119"/>
    <text x="904" y="125" fill="#8fa3ba" font-size="14" font-weight="600">Find parts that fit</text>
    <circle cx="1192" cy="119" r="5" fill="#00a37c"/>

    <!-- dropdown rows -->
    <g font-size="13.5" font-weight="600">
      <rect x="904" y="162" width="88" height="38" rx="8" fill="#12212f" stroke="#274058"/>
      <text x="918" y="186" fill="#e6eef7">2024 ▾</text>
      <rect x="1002" y="162" width="88" height="38" rx="8" fill="#12212f" stroke="#274058"/>
      <text x="1016" y="186" fill="#e6eef7">Ford ▾</text>
      <rect x="1100" y="162" width="96" height="38" rx="8" fill="#12212f" stroke="#274058"/>
      <text x="1114" y="186" fill="#e6eef7">F-150 ▾</text>
    </g>

    <rect x="904" y="216" width="292" height="40" rx="8" fill="url(#green)"/>
    <text x="1050" y="241" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">Find Parts</text>

    <rect x="904" y="272" width="292" height="34" rx="8" fill="#06251c" stroke="#166534"/>
    <text x="1050" y="294" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">✓ Guaranteed Exact Fit</text>
  </g>
</svg>
