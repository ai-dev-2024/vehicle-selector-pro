---
# bundler-audit ignore list.
#
# Each entry below is either NOT EXPLOITABLE in this deployment (verified
# against the codebase) or requires a scheduled dependency upgrade. The
# dependency audit job fails on any advisory NOT listed here, so new
# vulnerabilities still break CI — these are the only whitelisted exceptions.
#
# When the tracked upgrades land, remove the corresponding entries:
#   - shopify_app 22.5 -> 23.0.3+
#   - puma 6.6 -> 7.2.1+ (or 8.0.2+)
#   - polaris_view_components 2.x -> a release that allows view_component 4.14+
ignore:
  # --- Not exploitable: Puma PROXY protocol is not enabled ------------------
  # Both advisories only affect `set_remote_address proxy_protocol: :v1`,
  # which config/puma.rb never sets (verified). Fly terminates TLS and talks
  # plain HTTP to the app; no PROXY protocol on the listener.
  - GHSA-qpgp-93vx-g8v8   # Puma PROXY v1 parser memory exhaustion
  - GHSA-2vqw-3mp8-cgmx   # Puma PROXY v1 repeated protocol headers

  # --- Not exploitable: app never uses the vulnerable helper ---------------
  # The advisory is about current_shopify_domain resolving from the request
  # shop param. This app derives the shop exclusively from the verified
  # session (current_shopify_session&.shop, see Admin::BaseController) and
  # never calls current_shopify_domain/authenticated_shopify_domain. Fix
  # requires shopify_app 23.x (major bump) — tracked upgrade.
  - GHSA-6j52-38f8-qhxr   # shopify_app token-exchange shop context confusion

  # --- Not exploitable: no ViewComponent is ever rendered (2026-10-26) ------
  # The advisory is about slot/with_content state leaking between REUSED
  # component instances. view_component 3.27.0 is only here as a dependency
  # of polaris_view_components, which pins view_component < 4.0; the fix is
  # 4.14.0+. The app renders no ViewComponent at all (no ViewComponent::Base
  # subclass, no Polaris:: component, no polaris_* helper in app/, config/
  # or lib/ - verified with grep); the admin UI uses the Polaris CDN.
  # Tracked upgrade: polaris_view_components release allowing view_component 4.14+
  # (or drop the unused gem).
  - GHSA-8qw7-6phv-7q6p   # view_component slot/with_content state leak (incomplete fix for CVE-2026-54497)
  #
  # Not listed above because bundler-audit does not report them (checked
  # 2026-11-10 against OSV): GHSA-7f3r-gwc9-2995 (preview route) and
  # GHSA-hg3h-g7xc-f7vp (system-test entry point), both fixed in view_component
  # 4.9.0. They concern the preview and system-test routes, which
  # view_component mounts only in development and test by default, and the app
  # renders no ViewComponent. If ruby-advisory-db picks them up and this job
  # turns red, that reasoning is the starting point; dropping the unused
  # polaris_view_components gem removes all three.

  # --- Resolved by the Rails 7.2.3.2 upgrade (2026-09-01) -------------------
  # The seven Active Storage advisories that used to be listed here no longer
  # match 7.2.3.2 either; they were dropped in v1.4.0 after an audit run with
  # an empty ignore list reported only the puma and shopify_app entries above.
  # GHSA-v55j-83pf-r9cq (actionview XSS), GHSA-89vf-4333-qx8v (activesupport
  # ReDoS) and GHSA-2j26-frm8-cmj9 (activesupport SafeBuffer#% XSS) are all
  # patched in 7.2.3.2 - removed from the ignore list.
