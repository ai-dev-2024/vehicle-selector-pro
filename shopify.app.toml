# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Vehicle Selector Pro"
client_id = "1ace4dd6082915935f0901c26f37d4a0"
application_url = "https://vehicle-selector-pro.fly.dev"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_product_listings,read_customers,write_customers"
use_legacy_install_flow = false
optional_scopes = [ ]

# Product fitment metafield: the Rails app creates and manages the
# `custom.vehicle_fitment` definition (type json, pinned, storefront
# PUBLIC_READ) at install time via MetafieldDefinitionService, and syncs
# values via the GraphQL `metafieldsSet` mutation. A standard `custom`
# namespace is used so the merchant can inspect/edit values in the Shopify
# admin and the data is readable by native collection filters & Storefront API.
# (An app-owned `$app` definition was evaluated but cannot be driven by the
# Admin API token used for background sync, so `custom` was chosen instead.)

[auth]
redirect_urls = [ "https://vehicle-selector-pro.fly.dev/auth/shopify/callback" ]

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/products_create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products_update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products_delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app_uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop_update"
  topics = [ "shop/update" ]

  # Mandatory customer-privacy webhooks (customers/data_request,
  # customers/redact, shop/redact) cannot be registered here — Shopify
  # requires them to be configured in the Partners Dashboard under
  # "Customer privacy". The Rails endpoints for them are implemented at
  # /webhooks/customers_data_request, /webhooks/customers_redact and
  # /webhooks/shop_redact.

[app_proxy]
url = "https://vehicle-selector-pro.fly.dev/apps/vehicle-selector"
subpath = "vehicle-selector"
prefix = "apps"

[pos]
embedded = true
