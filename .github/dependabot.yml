version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Pinned to the default gem of the Ruby in .ruby-version (see Gemfile);
      # bump it together with .ruby-version, never on its own.
      - dependency-name: "openssl"
      # Major upgrades (Rails 8, shopify_app 23, puma 7+) are planned work,
      # not routine bumps. Grouped with everything else they kept the weekly
      # PR red, which also blocked the safe updates inside it.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Patch releases on their own, so this PR is the one that stays green.
      bundler-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      bundler-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
