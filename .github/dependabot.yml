version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      rails:
        patterns:
          - "rails"
          - "activerecord"
          - "actionpack"
          - "activesupport"
          - "railties"
      shopify:
        patterns:
          - "shopify_app"
          - "shopify_api"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
