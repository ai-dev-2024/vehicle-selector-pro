name: Pages — Report

# Publishes the client-facing project report (PDF + DOCX) to GitHub Pages.
# The repo's Pages source is set to "GitHub Actions" so this deploy-pages
# workflow is what actually publishes https://muhib-karim.github.io/vehicle-selector-pro/

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time and never let two pushes race.
concurrency:
  group: pages
  cancel-in-progress: false

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble report site
        run: |
          mkdir -p _site/demo
          # Client deliverables: full report (PDF + DOCX) and pitch deck (PDF + PPTX)
          cp report/Vehicle_Selector_Pro_Project_Report.pdf _site/
          cp report/Vehicle_Selector_Pro_Project_Report.docx _site/
          cp report/Vehicle_Selector_Pro_Pitch_Deck.pdf _site/
          cp report/Vehicle_Selector_Pro_Pitch_Deck.pptx _site/
          cp report/site/index.html _site/index.html
          # Interactive architecture diagram (Archify; source: docs/architecture.archify.json)
          cp report/site/architecture.html _site/architecture.html
          # Demo videos + interactive walkthrough served from the same Pages site
          cp demo/videos.html _site/demo/videos.html
          cp demo/index.html _site/demo/index.html
          cp demo/command-center.css _site/demo/command-center.css
          cp demo/vehicle-selector-merchant-poster.png _site/demo/
          cp demo/vehicle-selector-shopper-poster.png _site/demo/
          cp demo/vehicle-selector-merchant-poster.jpg _site/demo/
          cp demo/vehicle-selector-shopper-poster.jpg _site/demo/
          cp demo/vehicle-selector-pro-merchant.mp4 _site/demo/
          cp demo/vehicle-selector-pro-shopper.mp4 _site/demo/
          cp demo/vehicle-selector-merchant.webp _site/demo/
          cp demo/vehicle-selector-shopper.webp _site/demo/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1