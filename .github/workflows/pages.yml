name: Pages — Report

# Publishes the client-facing project report (PDF + DOCX) to GitHub Pages.
# The repo's Pages source is set to "GitHub Actions" so this deploy-pages
# workflow is what actually publishes https://ai-dev-2024.github.io/vehicle-selector-pro/

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time and never let two pushes race.
concurrency:
  group: pages
  cancel-in-progress: false

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble report site
        run: |
          mkdir -p _site
          cp report/Vehicle_Selector_Pro_Project_Report.pdf _site/
          cp report/Vehicle_Selector_Pro_Project_Report.docx _site/
          cp report/site/index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4