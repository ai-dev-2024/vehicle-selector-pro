name: Pages — Report

# Publishes the client-facing project report (PDF + DOCX) to GitHub Pages.
# The repo's Pages source is set to "GitHub Actions" so this deploy-pages
# workflow is what actually publishes https://ai-dev-2024.github.io/vehicle-selector-pro/

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time and never let two pushes race.
concurrency:
  group: pages
  cancel-in-progress: false

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble report site
        run: |
          mkdir -p _site
          cp report/Vehicle_Selector_Pro_Project_Report.pdf _site/
          cp report/Vehicle_Selector_Pro_Project_Report.docx _site/
          cat > _site/index.html <<'HTML'
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Selector Pro — Project Report</title>
<style>
  :root { --accent:#E04B33; --ink:#282A2E; --muted:#6E6E6E; --paper:#FAF9F8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif;
         background:linear-gradient(180deg,#ffffff,var(--paper)); color:var(--ink); min-height:100vh; }
  .rail { height:6px; background:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:64px 24px 96px; }
  .kicker { letter-spacing:.14em; text-transform:uppercase; font-size:12px;
            color:var(--accent); font-weight:700; margin-bottom:14px; }
  h1 { font-size:40px; line-height:1.08; font-weight:800; letter-spacing:-0.5px; }
  .sub { color:var(--muted); font-size:17px; margin-top:12px; max-width:56ch; line-height:1.5; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:40px; }
  .card { border:1px solid #E4E1DE; border-radius:12px; padding:26px; background:#fff;
          box-shadow:0 1px 2px rgba(0,0,0,.05); display:flex; flex-direction:column; }
  .type { text-transform:uppercase; letter-spacing:.1em; font-size:11px; color:var(--muted); font-weight:700; }
  .file { font-size:14px; color:var(--ink); margin:14px 0 18px; font-weight:600;
          overflow-wrap:anywhere; line-height:1.4; }
  .btn { display:inline-block; text-decoration:none; color:#fff; background:var(--accent);
         padding:11px 18px; border-radius:8px; font-weight:600; font-size:15px;
         text-align:center; transition:filter .12s; margin-top:auto; }
  .btn:hover { filter:brightness(.94); }
  .btn.ghost { color:var(--ink); background:#fff; border:1px solid #222; }
  .meta { margin-top:48px; border-top:1px solid #E4E1DE; padding-top:20px;
          color:var(--muted); font-size:13px; line-height:1.7; }
  .meta b { color:var(--ink); }
  a { color:var(--accent); }
  @media (max-width:600px){ .cards{ grid-template-columns:1fr; } h1{ font-size:32px; } }
</style>
</head>
<body>
<div class="rail"></div>
<main>
  <div class="kicker">Client Deliverable</div>
  <h1>Vehicle Selector Pro<br>Project Report</h1>
  <p class="sub">A production-grade Shopify app for automotive fitment. Live storefront demo,
  narrated walkthroughs, architecture, and tech-stack details. Built entirely with free AI tools.</p>

  <div class="cards">
    <div class="card">
      <div class="type">Read-Only</div>
      <div class="file">Vehicle_Selector_Pro_Project_Report.pdf</div>
      <a class="btn" href="Vehicle_Selector_Pro_Project_Report.pdf" download>Download PDF</a>
    </div>
    <div class="card">
      <div class="type">Editable</div>
      <div class="file">Vehicle_Selector_Pro_Project_Report.docx</div>
      <a class="btn ghost" href="Vehicle_Selector_Pro_Project_Report.docx" download>Download DOCX</a>
    </div>
  </div>

  <div class="meta">
    <b>Repository:</b> <a href="https://github.com/ai-dev-2024/vehicle-selector-pro">github.com/ai-dev-2024/vehicle-selector-pro</a> ·
    <b>Live demo:</b> <a href="https://vehicle-selector-pro.fly.dev/demo">vehicle-selector-pro.fly.dev/demo</a><br>
    Generated with <b>free AI tooling only</b> — no paid models or tools were used in development.
  </div>
</main>
</body>
</html>
HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4