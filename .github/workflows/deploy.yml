name: Deploy

# Manual only: the Fly.io app must be provisioned and FLY_API_TOKEN set before deploying.
# Running this on every push failed with "app not found" while no app exists.
on:
  workflow_dispatch:

# The job only reads the repository; the Fly token is the one credential it uses.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # One deploy at a time; never let two pushes race in parallel.
      group: fly-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Pinned to a release commit: a mutable branch here would run unreviewed
      # code in the same job that holds FLY_API_TOKEN.
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: flyctl deploy --remote-only --build-arg GIT_SHA=$GIT_SHA

      - name: Verify health after deploy
        run: |
          sleep 30
          curl -fsS https://vehicle-selector-pro.fly.dev/health/deep
          curl -fsS https://vehicle-selector-pro.fly.dev/up