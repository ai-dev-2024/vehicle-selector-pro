{
  "name": "Vehicle Selector Filters",
  "description": "Dynamic vehicle attribute filters for product collections",
  "version": "1.0.0",
  "config": {
    "title": "Vehicle Selector Settings",
    "sections": {
      "settings": {
        "type": "object",
        "properties": {
          "enable_filters": {
            "type": "boolean",
            "title": "Enable Vehicle Filters",
            "default": true
          },
          "filter_title": {
            "type": "string",
            "title": "Filter Section Title",
            "default": "Filter by Vehicle"
          },
          "show_product_count": {
            "type": "boolean",
            "title": "Show Product Count",
            "default": true
          },
          "layout": {
            "type": "string",
            "title": "Filter Layout",
            "enum": ["dropdown", "buttons", "sidebar"],
            "default": "dropdown"
          }
        }
      }
    }
  }
}
